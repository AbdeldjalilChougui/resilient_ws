name: resilient_ws
description: >-
  WebSocket and Server-Sent Events clients that survive bad mobile networks:
  backoff with jitter, fresh tokens, heartbeats, buffering and resubscribe.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbdeldjalilChougui/resilient_ws
issue_tracker: https://github.com/AbdeldjalilChougui/resilient_ws/issues
topics:
  - websocket
  - sse
  - realtime
  - network
  - reconnect

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  stream_channel: ^2.1.0
  test: ^1.25.0
